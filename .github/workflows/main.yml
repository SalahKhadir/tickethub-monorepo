name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ==========================================
  # STAGE 1: Quality & Secrets Gate (Parallel)
  # ==========================================
  gitleaks:
    name: "Security: Gitleaks Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-frontend:
    name: "Quality: Frontend (ESLint, Prettier, Audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Prettier Check
        working-directory: ./frontend
        run: npx prettier --check .

      - name: Run NPM Audit
        working-directory: ./frontend
        # Consider removing `|| true` to enforce pipeline failure on high vulnerabilities
        run: npm audit --audit-level=high || true 

  lint-backend:
    name: "Quality: Backend (Checkstyle, SpotBugs, Verify)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Verify, Checkstyle & SpotBugs
        working-directory: ./backend
        run: ./mvnw verify checkstyle:check spotbugs:check
